services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: loop
    ports:
      - "5433:5432"
    volumes:
      - loop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/loop?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/loop?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      # เก็บไฟล์ที่อัปโหลด (product images, id-cards) ไว้นอก container
      # ไม่ให้หายเวลา rebuild/recreate
      - loop_uploads:/repo/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3001:3001"

  # Reverse proxy — ออก TLS cert อัตโนมัติจาก Let's Encrypt ให้ rently.website (→ web)
  # และ api.rently.website (→ api) ต้องมี DNS A record ทั้งสอง subdomain ชี้มาเซิร์ฟเวอร์นี้ก่อน
  # ถึงจะออก cert สำเร็จ — ใช้เฉพาะตอน deploy จริงเท่านั้น (local dev ใช้ localhost:3001/4001 ตรงๆ ตามเดิม)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      PORT: ${PORT}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  loop_pgdata:
  loop_uploads:
  caddy_data:
  caddy_config:
